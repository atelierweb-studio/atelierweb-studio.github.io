<!DOCTYPE html><html><head><meta charset="utf-8"><title>QA frame</title>
<style>html,body{margin:0;background:#8a8a8a}iframe{border:0;display:block;margin:0 auto;background:#fff}
.bar{font:12px/1.3 monospace;color:#fff;padding:6px 10px}</style></head><body>
<div class="bar" id="bar"></div><iframe id="f"></iframe>
<script>var p=new URLSearchParams(location.search);var u=p.get('u')||'index.html',w=parseInt(p.get('w')||'1440',10),h=parseInt(p.get('h')||'900',10);var f=document.getElementById('f');f.width=w;f.height=h;f.src=u+(u.indexOf('?')>-1?'&':'?')+'lang=ko';document.getElementById('bar').textContent=u+' '+w+'x'+h;document.title='QA '+w;</script>
</body></html>
