<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>QA — responsive check</title>
<style>
  html,body{margin:0;background:#d9d9d9;font:12px/1.4 monospace}
  .frame{display:inline-block;vertical-align:top;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);margin:0}
  iframe{border:0;display:block}
</style>
</head>
<body>
<div class="frame"><iframe id="f" src="about:blank" width="768" height="960" scrolling="no"></iframe></div>
<script>
  var q = new URLSearchParams(location.search);
  var w = q.get('w') || 390, lang = q.get('lang') || 'en', y = parseInt(q.get('y') || '0', 10);
  var id = q.get('id'), cat = q.get('cat'), more = q.get('more');
  var f = document.getElementById('f');
  f.width = w;
  f.height = parseInt(q.get('h') || '960', 10);
  f.src = 'index.html?lang=' + lang;
  f.addEventListener('load', function () {
    function scroll() {
      var doc = f.contentDocument, win = f.contentWindow;
      var target = id ? doc.getElementById(id) : null;
      var base = target ? (target.getBoundingClientRect().top + win.scrollY) : 0;
      if (cat) {
        var chip = doc.querySelector('[data-cat="' + cat + '"]');
        if (chip) chip.click();
      }
      if (more) {
        var b = doc.getElementById('folioMore');
        for (var i = 0; i < parseInt(more, 10) && b && !b.hidden; i++) b.click();
      }
      win.scrollTo(0, base + y);
    }
    setTimeout(scroll, 700);
  });
</script>
</body>
</html>
