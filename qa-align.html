<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>QA — 980px 이하 서브텍스트 정렬</title>
<style>
  html,body{margin:0;padding:0;background:#2b2b2b;font:12px/1.4 monospace;color:#eee}
  .bar{padding:6px 10px;background:#111}
  iframe{border:0;display:block;background:#fff;height:960px;width:390px}
</style>
</head>
<body>
<div class="bar">QA iframe · <span id="label">-</span></div>
<iframe id="f" src="./index.html?qa=align"></iframe>
<script>
(function(){
  var w = parseInt(new URLSearchParams(location.search).get('w')||'0',10);
  var f = document.getElementById('f');
  if (w) f.style.width = w + 'px';
  document.getElementById('label').textContent = 'width=' + (w||f.getBoundingClientRect().width) + 'px';
})();
</script>
</body>
</html>
