<!DOCTYPE html>
<html lang="ko" data-lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier Web — 상품 상세</title>
<meta name="description" content="Atelier Web 상품 상세 — 옵션을 고르면 정확한 총액이 계산됩니다.">
<meta property="og:type" content="product">
<meta property="og:title" content="Atelier Web — Product detail">
<meta property="og:image" content="https://atelierweb-studio.github.io/og-cover.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23292D32'/%3E%3Crect x='21' y='21' width='7' height='7' fill='%23D2FF5A'/%3E%3Ctext x='12' y='21' font-family='Helvetica,Arial' font-size='11' font-weight='bold' fill='%23F9F8F6' text-anchor='middle'%3EAW%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<link rel="stylesheet" href="assets/css/styles.css?v=20261122d">
</head>
<body>

<div data-cw-header></div>

<main>
  <div class="wrap">
    <nav class="pd-crumb" aria-label="breadcrumb">
      <a href="services.html" data-i18n="back_to_products">All products</a>
      <span aria-hidden="true">/</span>
      <a href="#" id="crumbCat"></a>
      <span aria-hidden="true">/</span>
      <span id="crumbName"></span>
    </nav>
  </div>

  <div class="wrap">
    <div class="pd-top" id="pdTop">
      <div class="pd-media">
        <div class="pd-visual" id="pdVisual">
          <span class="pdv-k"></span>
          <span class="pdv-no"></span>
          <b></b>
          <span class="pdv-name"></span>
        </div>
        <div class="pd-examples" id="pdExamples"></div>
      </div>
      <div class="pd-info" id="pdInfo"></div>
    </div>
  </div>

  <div class="wrap">
    <div class="pd-tabs">
      <div class="tab-bar" role="tablist">
        <button type="button" class="is-on" data-tab="info" data-i18n="pd_tab_info">Details</button>
        <button type="button" data-tab="process" data-i18n="pd_tab_process">Process</button>
        <button type="button" data-tab="notes" data-i18n="pd_tab_notes">Notes</button>
        <button type="button" data-tab="faq" data-i18n="pd_tab_faq">FAQ</button>
      </div>
      <div class="tab-panel is-on" id="tab-info" data-panel="info"></div>
      <div class="tab-panel" id="tab-process" data-panel="process"></div>
      <div class="tab-panel" id="tab-notes" data-panel="notes"></div>
      <div class="tab-panel" id="tab-faq" data-panel="faq"></div>
    </div>

    <section class="sec-tight" style="border-top:1px solid var(--charcoal-12);padding-bottom:90px">
      <div class="sec-head" style="margin-bottom:24px">
        <div><div class="eyebrow"><b>NEXT</b> <span data-i18n="pd_related">Related items</span></div></div>
      </div>
      <div class="prod-grid is-4" id="related"></div>
    </section>
  </div>
</main>

<div class="mobile-buy" id="mobileBuy" hidden>
  <div class="mb-in">
    <div class="mb-sum"><span data-i18n="pd_sticky_total">Total</span><b id="mbTotal">—</b></div>
    <button class="btn btn-accent" type="button" id="mbBuy" data-i18n="pd_buy">Buy now</button>
  </div>
</div>

<div data-cw-footer></div>
<noscript><div class="wrap" style="padding:20px" data-i18n="noscript">JavaScript is off.</div></noscript>

<script src="assets/data/catalog.js?v=20261122d"></script>
<script src="assets/js/i18n.js?v=20261122d"></script>
<script src="assets/js/store.js?v=20261122d"></script>
<script src="assets/js/components.js?v=20261122d"></script>
<script>
(function () {
  'use strict';
  var I = window.CWI18N, C = window.CATALOG, S = window.CWStore, U = window.CWComponents;

  var params = new URLSearchParams(location.search);
  var product = C.byId(params.get('id')) || C.byId('detail-page');
  var qty = 1;
  var optionIds = {};

  function initOptions() {
    optionIds = {};
    if (product.options) {
      product.options.forEach(function (o) { optionIds[o.id] = o.def; });
    }
    if (product.preset) {
      Object.keys(product.preset).forEach(function (k) { optionIds[k] = product.preset[k]; });
    }
    if (params.get('plan') === 'included' && product.options) {
      product.options.forEach(function (o) { if (o.id === 'plan') optionIds.plan = 'included'; });
    }
  }

  function calc() { return S.computeLine(product, optionIds, qty); }

  function badge(p) {
    return p.price.mode === 'fixed'
      ? '<span class="badge badge-lime">' + I.t('badge_buy') + '</span>'
      : '<span class="badge badge-line">' + I.t('badge_quote') + '</span>';
  }

  function renderMedia() {
    var v = document.getElementById('pdVisual');
    var cat = C.cat(product.cat);
    v.className = 'pd-visual ' + (product.tone || 'th-a');
    v.querySelector('.pdv-k').textContent = cat.code + ' · ' + I.tv(cat.name);
    v.querySelector('.pdv-no').textContent = String(product.order).padStart(2, '0');
    v.querySelector('b').textContent = product.word;
    v.querySelector('.pdv-name').textContent = I.tv(product.name);
    v.style.position = 'relative';

    var ex = document.getElementById('pdExamples');
    ex.innerHTML = ['01', '02', '03'].map(function (n, i) {
      var tone = ['th-c', 'th-f', 'th-g'][i];
      return '<div class="' + tone + '"><i>' + (i === 0 ? 'LAYOUT' : (i === 1 ? 'TYPE' : 'DETAIL')) + ' ' + n + '</i></div>';
    }).join('');

    document.getElementById('crumbCat').textContent = I.tv(cat.name);
    document.getElementById('crumbCat').href = 'services.html#cat-' + cat.id;
    document.getElementById('crumbName').textContent = I.tv(product.name);
    document.title = 'Atelier Web — ' + I.tv(product.name);
  }

  function optionsHTML() {
    if (!product.options) return quoteBoxHTML();
    var h = '<div class="opt-box">';
    h += '<div class="opt-head"><b data-i18n="pd_options">' + I.t('pd_options') + '</b><span class="tiny muted">' + I.t('price_vat_add') + '</span></div>';
    product.options.forEach(function (o, oi) {
      h += '<div class="opt-group"><div class="opt-label"><b>' + 'OPTION ' + String(oi + 1).padStart(2, '0') + ' · ' + I.tv(o.label) + '</b><span>' + I.tv(o.hint) + '</span></div><div class="opt-choices">';
      o.values.forEach(function (v) {
        var on = optionIds[o.id] === v.id;
        var extra = '';
        if (v.per10k) {
          var amount = Math.round(((optionIds.length === '20000' ? 20000 : 10000) / 10000) * v.per10k);
          extra = '+' + I.money(amount);
        } else if (v.price) {
          extra = (o.id === 'length' ? '' : '+') + I.money(v.price);
        } else {
          extra = I.money(0);
        }
        h += '<button type="button" class="opt-btn' + (on ? ' is-on' : '') + '" data-opt="' + o.id + '" data-val="' + v.id + '">' +
          '<b>' + I.tv(v.label) + '</b><span>' + extra + ' · ' + I.tv(v.note) + '</span></button>';
      });
      h += '</div></div>';
    });

    h += '<div class="opt-group"><div class="qty-row"><div><div class="opt-label"><b data-i18n="pd_qty">' + I.t('pd_qty') + '</b></div>' +
      '<span class="tiny muted">' + (product.qty ? '1 – ' + product.qty.max : '1') + '</span></div>' +
      '<div class="qty"><button type="button" data-qty="-1" aria-label="minus">−</button><input type="number" id="qtyInput" value="' + qty + '" min="1" max="' + (product.qty ? product.qty.max : 99) + '"><button type="button" data-qty="1" aria-label="plus">+</button></div></div></div>';

    h += '<div class="opt-sum" id="calcMount"></div>';
    h += '</div>';
    return h;
  }

  function quoteBoxHTML() {
    var deliverables = C.cat(product.cat).deliverables.map(function (d) { return '<li>' + I.tv(d) + '</li>'; }).join('');
    var feats = product.features ? product.features.map(function (f) { return '<li>' + I.tv(f) + '</li>'; }).join('') : '';
    return '<div class="opt-box">' +
      '<div class="opt-head"><b data-i18n="pd_options">' + I.t('pd_options') + '</b><span class="badge badge-line">' + I.t('badge_quote') + '</span></div>' +
      '<div class="opt-group">' +
      '<p class="tiny muted" style="line-height:1.65">' + I.t('pd_no_options') + '</p>' +
      '<div class="mt-16"><div class="opt-label"><b>' + I.t('pd_includes') + '</b></div><ul class="spec-list">' + deliverables + feats + '</ul></div>' +
      (product.quoteFrom ? '<p class="tiny" style="margin-top:14px;border-left:2px solid var(--lime);padding-left:10px">' + I.tv(product.quoteFrom) + '</p>' : '') +
      '</div>' +
      '<div class="opt-sum"><div class="opt-total"><span class="lbl">' + I.t('pd_total') + '</span><span class="val" style="font-size:15px;letter-spacing:0">' + I.t('price_quote') + '</span></div>' +
      '<p class="tiny muted mt-8">' + I.t('pd_quote_note') + '</p></div>' +
      '</div>';
  }

  function renderCalc() {
    var mount = document.getElementById('calcMount');
    if (!mount) return;
    var c = calc();
    var h = '';
    c.optionLabels.forEach(function (l) {
      var amt = 0;
      if (l.opt.id === 'length') amt = c.design;
      else if (l.val.per10k) amt = c.planning;
      else amt = (l.opt.id === 'source' ? c.source : (l.val.price || 0));
      var lineLabel = l.opt.id === 'length' ? I.tv(l.val.label) : (I.tv(l.opt.label) + ': ' + I.tv(l.val.label));
      h += '<div class="opt-line"><span>' + lineLabel + '</span><b>' + I.money(amt) + '</b></div>';
    });
    if (c.qty > 1) {
      h += '<div class="opt-line"><span>' + I.t('pd_supply') + ' × ' + c.qty + '</span><b>' + I.money(c.supply) + '</b></div>';
    }
    h += '<div class="opt-line"><span>' + I.t('pd_vat_line') + '</span><b>' + I.money(c.vat) + '</b></div>';
    h += '<div class="opt-total"><span class="lbl">' + I.t('pd_total') + '</span><span class="val">' + I.money(c.total) + '<small>' + I.t('price_vat') + '</small></span></div>';
    mount.innerHTML = h;

    var mb = document.getElementById('mbTotal');
    if (mb) mb.textContent = I.money(c.total);
  }

  function renderInfo() {
    var host = document.getElementById('pdInfo');
    var cat = C.cat(product.cat);
    var fixed = product.price.mode === 'fixed';
    var h = '';
    h += '<div class="pd-cat">' + cat.code + ' · ' + I.tv(cat.name) + ' ' + badge(product) + '</div>';
    h += '<h1>' + I.tv(product.name) + '</h1>';
    h += '<p class="pd-sub">' + I.tv(product.desc) + '</p>';

    if (fixed) {
      h += '<div class="pd-pricebase"><b>' + I.fromMoney(product.price.fromInclVat) + '</b><span>' + I.t('price_vat') + '</span></div>';
    } else if (product.price.amountFrom) {
      h += '<div class="pd-pricebase"><b>' + I.fromMoney(product.price.amountFrom, product.price.currency) + '</b><span>' + I.t('price_from') + ' · ' + I.t('badge_quote') + '</span></div>';
    } else {
      h += '<div class="pd-pricebase"><b>' + I.t('price_quote') + '</b><span>' + (product.quoteFrom ? I.tv(product.quoteFrom) : '') + '</span></div>';
    }

    if (product.lead) h += '<p class="tiny muted mt-16" style="line-height:1.7;max-width:56ch">' + I.tv(product.lead) + '</p>';

    h += optionsHTML();

    if (fixed) {
      h += '<div class="pd-actions">' +
        '<button class="btn" type="button" id="buyNow">' + I.t('pd_buy') + '</button>' +
        '<button class="btn btn-ghost" type="button" id="addCart">' + I.t('pd_add_cart') + '</button>' +
        '</div>';
      h += '<div class="notice mt-16" style="font-size:11.5px"><span class="notice-mark">i</span><p>' + I.t('pd_price_note') + '</p></div>';
      h += '<ul class="pd-notes mt-16">' +
        (product.includes ? product.includes.map(function (x) { return '<li>' + I.tv(x) + '</li>'; }).join('') : '') +
        '</ul>';
    } else {
      h += '<div class="pd-actions">' +
        '<a class="btn btn-accent" id="askBtn" href="#contact-mail">' + I.t('pd_ask') + '</a>' +
        '<a class="btn btn-ghost" href="services.html" data-i18n="back_to_products">' + I.t('back_to_products') + '</a>' +
        '</div>';
      h += '<div class="notice mt-16" style="font-size:11.5px"><span class="notice-mark">i</span><p>' + I.t('pd_quote_note') + '</p></div>';
    }

    /* option notes */
    if (product.options) {
      var plan = product.options.filter(function (o) { return o.id === 'plan'; })[0];
      var src = product.options.filter(function (o) { return o.id === 'source'; })[0];
      h += '<ul class="pd-notes mt-16">';
      if (plan) h += '<li>' + I.t('pd_plan_note') + '</li>';
      if (src) h += '<li>' + I.t('pd_source_note') + '</li>';
      h += '</ul>';
    }

    host.innerHTML = h;

    if (fixed) {
      document.getElementById('buyNow').addEventListener('click', function () { buy(true); });
      document.getElementById('addCart').addEventListener('click', function () { buy(false); });
    } else {
      var ask = document.getElementById('askBtn');
      var subject = '[Atelier Web] ' + I.t('pd_ask') + ' — ' + I.tv(product.name);
      var body = 'Product: ' + I.tv(product.name) + '\nURL: ' + location.href + '\n\n' +
        'Business / brand:\nContact name:\nPhone:\nDeadline:\n\nWhat we need:\n';
      ask.href = 'mailto:atelierweb.seoul@gmail.com?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
    }
  }

  function buy(goOrder) {
    S.addToCart(product.id, optionIds, qty);
    U.toast(I.t('toast_added'));
    if (goOrder) window.location.href = 'order.html';
  }

  function renderTabs() {
    var cat = C.cat(product.cat);
    var info = document.getElementById('tab-info');
    var process = document.getElementById('tab-process');
    var notes = document.getElementById('tab-notes');
    var faq = document.getElementById('tab-faq');

    var includes = (product.includes || cat.deliverables).map(function (x) { return '<li>' + I.tv(x) + '</li>'; }).join('');
    var feats = product.features ? product.features.map(function (f) { return '<li>' + I.tv(f) + '</li>'; }).join('') : '';

    info.innerHTML =
      '<div class="spec-grid">' +
      '<div>' +
      '<h3>' + I.tv(product.name) + '</h3>' +
      '<p class="lede" style="font-size:13.5px">' + (product.lead ? I.tv(product.lead) : I.tv(cat.desc)) + '</p>' +
      '<h4>' + I.t('pd_includes') + '</h4><ul class="spec-list">' + includes + '</ul>' +
      (feats ? '<h4>' + I.t('pd_tab_info') + '</h4><ul class="spec-list">' + feats + '</ul>' : '') +
      '</div>' +
      '<div>' +
      '<dl class="spec-table">' +
      '<div><dt>' + I.t('pd_cat_label') + '</dt><dd>' + I.tv(cat.name) + '</dd></div>' +
      '<div><dt>' + I.t('pd_purchase') + '</dt><dd>' + (product.price.mode === 'fixed' ? I.t('badge_buy') + ' · ' + I.fromMoney(product.price.fromInclVat) : I.t('badge_quote')) + '</dd></div>' +
      '<div><dt>' + I.t('pd_turnaround') + '</dt><dd>' + I.t('step4_time') + '</dd></div>' +
      '<div><dt>' + I.t('pd_options_label') + '</dt><dd>' + (product.options ? product.options.map(function (o) { return I.tv(o.label); }).join(' · ') : I.tv(cat.deliverables[0])) + '</dd></div>' +
      '</dl>' +
      (product.revision ? '<div class="rev-scope"><b>' + I.t('pd_revision') + '</b><p>' + I.tv(product.revision) + '</p></div>' : '') +
      '</div></div>';

    process.innerHTML =
      '<div class="steps" style="border-top:0">' +
      ['step1', 'step2', 'step3', 'step4', 'step5'].map(function (s, i) {
        return '<div class="step"><div class="step-n">0' + (i + 1) + '</div><h3>' + I.t(s + '_t') + '</h3><p>' + I.t(s + '_d') + '</p><span class="step-time">' + I.t(s + '_time') + '</span></div>';
      }).join('') + '</div>';

    notes.innerHTML =
      '<div class="spec-grid"><div><h3>' + I.t('pd_tab_notes') + '</h3><ul class="spec-list">' +
      '<li>' + I.t('pd_price_note') + '</li>' +
      '<li>' + I.t('a7') + '</li>' +
      '<li>' + I.t('a4') + '</li>' +
      '<li>' + I.t('a6') + '</li>' +
      '<li>' + I.t('a8') + '</li>' +
      '</ul></div><div><h3>' + I.t('sub_files_sub').split('·')[0] + '</h3><ul class="spec-list">' +
      '<li>' + I.t('file_product_img') + ' · ' + I.t('file_logo') + ' · ' + I.t('file_copy') + '</li>' +
      '<li>' + I.t('file_plan') + ' · ' + I.t('file_ref') + ' · ' + I.t('file_etc') + '</li>' +
      '<li>JPG · PNG · WEBP · GIF · PDF · AI · PSD · ZIP</li>' +
      '</ul></div></div>';

    faq.innerHTML = '<div style="max-width:820px">' +
      [['q1', 'a1'], ['q2', 'a2'], ['q3', 'a3'], ['q4', 'a4'], ['q5', 'a5'], ['q6', 'a6'], ['q7', 'a7']].map(function (qa, i) {
        return '<details class="faq"' + (i === 0 ? ' open' : '') + '><summary>' + I.t(qa[0]) + '</summary><div class="faq-a">' + I.t(qa[1]) + '</div></details>';
      }).join('') + '</div>';
  }

  function renderRelated() {
    var host = document.getElementById('related');
    var list = C.byCat(product.cat).filter(function (p) { return p.id !== product.id; }).slice(0, 4);
    if (list.length < 4) {
      C.products.filter(function (p) { return p.cat !== product.cat && p.price.mode === 'fixed'; }).forEach(function (p) {
        if (list.length < 4 && !list.some(function (x) { return x.id === p.id; })) list.push(p);
      });
    }
    host.innerHTML = list.map(U.productCard).join('');
  }

  function renderAll() {
    initOptions();
    renderMedia();
    renderInfo();
    renderTabs();
    renderRelated();
    renderCalc();
    var mb = document.getElementById('mobileBuy');
    if (mb) {
      mb.hidden = product.price.mode !== 'fixed';
      document.body.classList.toggle('has-mobile-buy', product.price.mode === 'fixed');
    }
  }

  document.addEventListener('click', function (e) {
    var opt = e.target.closest('[data-opt]');
    if (opt) {
      optionIds[opt.getAttribute('data-opt')] = opt.getAttribute('data-val');
      renderInfo(); renderCalc();
      return;
    }
    var q = e.target.closest('[data-qty]');
    if (q) {
      qty = Math.max(1, Math.min(product.qty ? product.qty.max : 99, qty + parseInt(q.getAttribute('data-qty'), 10)));
      var inp = document.getElementById('qtyInput');
      if (inp) inp.value = qty;
      renderCalc();
      return;
    }
    var tab = e.target.closest('[data-tab]');
    if (tab) {
      var id = tab.getAttribute('data-tab');
      document.querySelectorAll('.tab-bar button').forEach(function (b) { b.classList.toggle('is-on', b === tab); });
      document.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.toggle('is-on', p.getAttribute('data-panel') === id); });
    }
  });

  document.addEventListener('input', function (e) {
    if (e.target.id === 'qtyInput') {
      var v = parseInt(e.target.value, 10);
      qty = isNaN(v) ? 1 : Math.max(1, Math.min(product.qty ? product.qty.max : 99, v));
      renderCalc();
    }
  });

  document.addEventListener('DOMContentLoaded', function () {
    U.init({ active: 'services' });
    renderAll();
    I.onChange(renderAll);
    var mb = document.getElementById('mbBuy');
    if (mb) mb.addEventListener('click', function () { buy(true); });
  });
})();
</script>
</body>
</html>
